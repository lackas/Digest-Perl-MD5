name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl: ['5.16', '5.20', '5.24', '5.28', '5.32', '5.36', '5.38']
    name: Perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install dependencies
        run: cpanm --notest ExtUtils::MakeMaker
      - name: Build
        run: |
          perl Makefile.PL
          make
      - name: Test
        run: make test

  test-32bit:
    runs-on: ubuntu-latest
    name: Perl 32-bit
    steps:
      - uses: actions/checkout@v4
      - name: Test on 32-bit
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: i386
          distro: bullseye
          run: |
            apt-get update
            apt-get install -y perl make
            perl Makefile.PL
            make
            make test
